<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f7f5" />
  <title>買い物メモ</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <style>
    :root{
      --bg:#f7f7f5;
      --card:#ffffff;
      --text:#1f2328;
      --muted:#71767d;
      --line:#e7e7e3;
      --accent:#2f6b4f;
      --accent-soft:#e9f2ed;
      --food:#a85b2c;
      --food-soft:#fbefe7;
      --daily:#3c638c;
      --daily-soft:#edf3f8;
      --shadow:0 8px 28px rgba(0,0,0,.06);
      --radius:20px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif}
    body{min-height:100vh}
    button,input{font:inherit}
    button{cursor:pointer}
    .app{max-width:760px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 28px)}
    .top{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 14px}
    h1{font-size:25px;margin:0;font-weight:800;letter-spacing:.01em}
    .summary{font-size:13px;color:var(--muted);font-weight:700}
    .tabs{
      position:sticky;top:calc(env(safe-area-inset-top) + 8px);z-index:10;
      display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:6px;
      background:rgba(255,255,255,.92);backdrop-filter:blur(12px);
      border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin-bottom:16px
    }
    .tab{border:0;background:transparent;border-radius:12px;padding:11px 8px;font-weight:800;color:var(--muted)}
    .tab.active{background:var(--text);color:#fff}
    .screen{display:none}
    .screen.active{display:block}
    .grid{display:grid;grid-template-columns:1fr;gap:14px}
    @media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}
    .card{
      background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
      box-shadow:var(--shadow);overflow:hidden
    }
    .card-head{display:flex;align-items:center;justify-content:space-between;padding:17px 17px 11px}
    .title-wrap{display:flex;align-items:center;gap:10px}
    .icon{
      width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:19px
    }
    .icon.daily{background:var(--daily-soft)}
    .icon.food{background:var(--food-soft)}
    .icon.online{background:var(--accent-soft)}
    .card h2{font-size:18px;margin:0;font-weight:800}
    .badge{font-size:12px;font-weight:800;color:var(--muted);background:#f1f1ef;border-radius:999px;padding:5px 9px}
    .items{padding:0 12px 6px}
    .empty{padding:22px 8px 24px;color:#9a9da2;text-align:center;font-size:14px}
    .item{
      display:flex;align-items:center;gap:10px;min-height:50px;padding:8px 4px;border-top:1px solid var(--line);
      animation:in .16s ease-out
    }
    .item:first-child{border-top:0}
    @keyframes in{from{opacity:.35;transform:translateY(4px)}to{opacity:1;transform:none}}
    .buy{
      flex:1;border:0;background:transparent;text-align:left;padding:6px 2px;font-weight:750;color:var(--text);
      overflow-wrap:anywhere
    }
    .item.checked .buy{
      color:#9a9da2;text-decoration:line-through;
    }
    .check{
      width:32px;height:32px;border:2px solid #cfd4d0;background:#fff;border-radius:9px;
      display:grid;place-items:center;font-size:18px;color:var(--accent);font-weight:900;
      flex:0 0 auto
    }
    .check.checked{
      border-color:var(--accent);background:var(--accent-soft)
    }
    .check:active{transform:scale(.94)}
    .bulk-wrap{
      display:flex;justify-content:flex-end;
      padding:8px 12px 12px;border-top:1px solid var(--line);background:#fcfcfb
    }
    .bulk-delete{
      border:0;background:var(--text);color:#fff;border-radius:12px;
      padding:11px 15px;font-weight:800;min-width:64px
    }
    .bulk-delete:disabled{
      background:#e7e7e3;color:#aaa;cursor:default
    }
    .form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);background:#fcfcfb}
    .form input{
      min-width:0;flex:1;border:1px solid #dcdedb;background:#fff;border-radius:12px;padding:12px 13px;
      outline:none
    }
    .form input:focus{border-color:#9db5a8;box-shadow:0 0 0 3px rgba(47,107,79,.08)}
    .add{
      border:0;background:var(--text);color:#fff;border-radius:12px;padding:0 15px;font-weight:800
    }
    .online-card{max-width:760px}
    .hint{font-size:13px;color:var(--muted);padding:0 17px 14px;line-height:1.55}
    .snack{
      position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);transform:translate(-50%,18px);
      background:#232629;color:#fff;border-radius:14px;padding:11px 12px 11px 15px;
      display:flex;gap:14px;align-items:center;opacity:0;pointer-events:none;transition:.2s;z-index:30;
      max-width:calc(100vw - 28px);box-shadow:0 12px 30px rgba(0,0,0,.2)
    }
    .snack.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
    .snack span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
    .undo{border:0;background:transparent;color:#bfe4cd;font-weight:900;padding:4px}
    .footer-note{font-size:12px;text-align:center;color:#a0a3a6;margin-top:18px}
  </style>
</head>
<body>
  <main class="app">
    <div class="top">
      <h1>買い物メモ</h1>
      <div class="summary" id="summary">0件</div>
    </div>

    <nav class="tabs" aria-label="買い物方法">
      <button class="tab active" data-screen="store">🛒 店で買う</button>
      <button class="tab" data-screen="online">📦 ネットで買う</button>
      <button class="tab" data-screen="todo">✓ ToDo</button>
    </nav>

    <section class="screen active" id="screen-store">
      <article class="card online-card">
        <div class="card-head">
          <div class="title-wrap">
            <div class="icon daily">🛒</div>
            <h2>店で買うもの</h2>
          </div>
          <span class="badge" id="store-count">0件</span>
        </div>
        <div class="items" id="store-list"></div>
        <div class="bulk-wrap">
          <button class="bulk-delete" id="store-delete-checked" data-delete-checked="store" type="button">削除</button>
        </div>
        <form class="form" data-category="store">
          <input id="store-input" autocomplete="off" placeholder="例：牛乳、ティッシュ" aria-label="店で買うものを追加" />
          <button class="add" type="submit">追加</button>
        </form>
      </article>
    </section>

    <section class="screen" id="screen-online">
      <article class="card online-card">
        <div class="card-head">
          <div class="title-wrap">
            <div class="icon online">📦</div>
            <h2>ネットで買うもの</h2>
          </div>
          <span class="badge" id="online-count">0件</span>
        </div>
        <div class="items" id="online-list"></div>
        <div class="bulk-wrap">
          <button class="bulk-delete" id="online-delete-checked" data-delete-checked="online" type="button">削除</button>
        </div>
        <form class="form" data-category="online">
          <input id="online-input" autocomplete="off" placeholder="例：充電ケーブル" aria-label="ネットで買うものを追加" />
          <button class="add" type="submit">追加</button>
        </form>
      </article>
    </section>


    <section class="screen" id="screen-todo">
      <article class="card online-card">
        <div class="card-head">
          <div class="title-wrap">
            <div class="icon online">✓</div>
            <h2>ToDo</h2>
          </div>
          <span class="badge" id="todo-count">0件</span>
        </div>
        <div class="items" id="todo-list"></div>
        <div class="bulk-wrap">
          <button class="bulk-delete" id="todo-delete-checked" data-delete-checked="todo" type="button">削除</button>
        </div>
        <form class="form" data-category="todo">
          <input id="todo-input" autocomplete="off" placeholder="例：クリーニングに出す" aria-label="ToDoを追加" />
          <button class="add" type="submit">追加</button>
        </form>
      </article>
    </section>

    <div class="footer-note">内容はこの端末内に保存されます</div>
  </main>

  <div class="snack" id="snack">
    <span id="snack-text"></span>
    <button class="undo" id="undo-btn">元に戻す</button>
  </div>

<script>
(() => {
  const KEY = 'shoppingMemoData_v2';
  const OLD_KEY = 'shoppingMemoData_v1';
  const emptyData = { store: [], online: [], todo: [] };
  let data = load();
  let lastDeleted = null;
  let snackTimer = null;

  function load(){
    try{
      const raw = localStorage.getItem(KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        return {
          store: Array.isArray(parsed.store) ? parsed.store.map(x => ({...x, checked: !!x.checked})) : [],
          online: Array.isArray(parsed.online) ? parsed.online.map(x => ({...x, checked: !!x.checked})) : [],
          todo: Array.isArray(parsed.todo) ? parsed.todo.map(x => ({...x, checked: !!x.checked})) : []
        };
      }

      // v1.0からの自動移行：日用品＋食料品を「店で買う」に統合
      const oldRaw = localStorage.getItem(OLD_KEY);
      if(oldRaw){
        const old = JSON.parse(oldRaw);
        const migrated = {
          store: [
            ...(Array.isArray(old.daily) ? old.daily : []),
            ...(Array.isArray(old.food) ? old.food : [])
          ].map(x => ({...x, checked:false})).sort((a,b) => (a.createdAt || 0) - (b.createdAt || 0)),
          online: Array.isArray(old.online) ? old.online.map(x => ({...x, checked:false})) : [],
          todo: []
        };
        localStorage.setItem(KEY, JSON.stringify(migrated));
        return migrated;
      }

      return structuredClone(emptyData);
    }catch(e){
      return structuredClone(emptyData);
    }
  }

  function save(){
    localStorage.setItem(KEY, JSON.stringify(data));
  }

  function esc(s){
    return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
  }

  function renderCategory(category){
    const list = document.getElementById(category + '-list');
    const count = document.getElementById(category + '-count');
    const items = data[category];

    count.textContent = items.length + '件';

    if(items.length === 0){
      list.innerHTML = '<div class="empty">買うものはありません</div>';
      return;
    }

    list.innerHTML = items.map(item => `
      <div class="item ${item.checked ? 'checked' : ''}">
        <button class="check ${item.checked ? 'checked' : ''}" type="button"
          data-action="toggle-check" data-category="${category}" data-id="${item.id}"
          aria-label="${esc(item.text)}を${item.checked ? '未チェックに戻す' : 'チェックする'}">
          ${item.checked ? '✓' : ''}
        </button>
        <div class="buy">${esc(item.text)}</div>
      </div>
    `).join('');

    const checkedCount = items.filter(x => x.checked).length;
    const deleteBtn = document.getElementById(category + '-delete-checked');
    if(deleteBtn){
      deleteBtn.disabled = checkedCount === 0;
      deleteBtn.textContent = '削除';
    }
  }

  function render(){
    ['store','online','todo'].forEach(renderCategory);
    const total = data.store.length + data.online.length + data.todo.length;
    document.getElementById('summary').textContent = total + '件';
  }

  function addItem(category, text){
    const clean = text.trim();
    if(!clean) return;
    data[category].push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
      text: clean,
      createdAt: Date.now(),
      checked: false
    });
    save();
    render();
  }

  function toggleCheck(category, id){
    const item = data[category].find(x => x.id === id);
    if(!item) return;
    item.checked = !item.checked;
    save();
    render();
  }

  function deleteChecked(category){
    const removed = data[category].filter(x => x.checked);
    if(removed.length === 0) return;

    const original = [...data[category]];
    data[category] = data[category].filter(x => !x.checked);
    lastDeleted = { category, original, bulk: true };
    save();
    render();
    showSnack(`${removed.length}件を削除しました`);
  }

  function showSnack(text){
    const snack = document.getElementById('snack');
    document.getElementById('snack-text').textContent = text;
    snack.classList.add('show');
    clearTimeout(snackTimer);
    snackTimer = setTimeout(() => {
      snack.classList.remove('show');
      lastDeleted = null;
    }, 3500);
  }

  document.querySelectorAll('.form').forEach(form => {
    form.addEventListener('submit', e => {
      e.preventDefault();
      const category = form.dataset.category;
      const input = form.querySelector('input');
      addItem(category, input.value);
      input.value = '';
      input.focus();
    });
  });

  document.addEventListener('click', e => {
    const check = e.target.closest('[data-action="toggle-check"]');
    if(check){
      toggleCheck(check.dataset.category, check.dataset.id);
      return;
    }

    const bulk = e.target.closest('[data-delete-checked]');
    if(bulk && !bulk.disabled){
      deleteChecked(bulk.dataset.deleteChecked);
    }
  });

  document.getElementById('undo-btn').addEventListener('click', () => {
    if(!lastDeleted) return;

    if(lastDeleted.bulk){
      data[lastDeleted.category] = lastDeleted.original;
    }

    lastDeleted = null;
    save();
    render();
    document.getElementById('snack').classList.remove('show');
    clearTimeout(snackTimer);
  });

  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      const screen = tab.dataset.screen;
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === tab));
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById('screen-' + screen).classList.add('active');
    });
  });

  if('serviceWorker' in navigator){
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }

  render();
})();
</script>
</body>
</html>
